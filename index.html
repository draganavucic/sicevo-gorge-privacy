<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sićevo Gorge - Discover Nature</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #2b2bb5, #6a1bb3);
      color: #fff;
      text-align: center;
    }
    header {
      padding: 30px 20px 10px;
      font-size: 2rem;
      font-weight: 600;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .phones {
      max-width: 700px;
      width: 90%;
      margin: 20px auto;
    }
    .phones img {
      width: 100%;
      height: auto;
      border-radius: 12px;
    }
    h2 {
      font-size: 1.6rem;
      margin-top: 20px;
    }
    p {
      font-size: 1.1rem;
      max-width: 600px;
      margin: 10px auto 30px;
      line-height: 1.6;
    }
    .play-badge img {
      width: 180px;
      height: auto;
      margin-top: 10px;
    }
    footer {
      font-size: 0.9rem;
      color: #ddd;
      margin-top: 40px;
      padding-bottom: 20px;
    }
    .links a {
      color: #fff;
      text-decoration: underline;
      margin: 0 10px;
      font-size: 0.95rem;
    }
    @media (min-width: 768px) {
      .content {
        flex-direction: row;
        justify-content: space-around;
        text-align: left;
      }
      .text {
        max-width: 400px;
      }
      .phones {
        max-width: 350px;
      }
    }
  </style>
</head>
<body>

  <header>Sićevo Gorge</header>

  <div class="content">
    <div class="phones">
      <!-- Replace with your image later -->
      <img src="images/phones.png" alt="Sićevo Gorge app preview">
    </div>

    <div class="text">
      <h2>Great app for your next adventure!</h2>
      <p>Discover with us Sićevo Gorge & enjoy nature like never before.  
      Explore culture, history, landscapes, and local attractions — all in one place.</p>

      <div class="play-badge">
        <a href="https://sicevo-gorge.flycricket.io/?download=rs.nis.sicevo.discoverer" target="_blank">
          <img src="images/google-play-badge.png" alt="Get it on Google Play">
        </a>
      </div>
    </div>
  </div>

  <footer>
    <div class="links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms & Conditions</a>
    </div>
    © 2026 Dragana Vucic — Sićevo Gorge App
  </footer>

</body>
</html>
